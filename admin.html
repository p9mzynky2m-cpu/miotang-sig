
<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>미오탱 시그 관리자</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#111014;color:#f9edf3;font-family:system-ui,-apple-system,'Apple SD Gothic Neo',sans-serif}
.wrap{max-width:900px;margin:auto;padding:35px 18px 80px}
.hero{text-align:center;padding:30px 0 25px}
.eyebrow{color:#e8b9cd;letter-spacing:4px;font-size:12px}
.hero h1{font-size:clamp(30px,7vw,49px);margin:12px 0}
.hero p{color:#c9b9c3;font-size:14px}
input,textarea{width:100%;padding:16px 18px;background:#272129;color:#fff;border:1px solid #6d4c60;border-radius:14px;font-size:16px;outline:none;font-family:inherit}
textarea{resize:vertical;min-height:85px}
input:focus,textarea:focus{border-color:#f5b9d3}
input::placeholder,textarea::placeholder{color:#a999a4}
button{cursor:pointer}
.primary{border:0;border-radius:12px;background:#efb9d0;color:#21151d;font-weight:700;padding:13px 18px}
.secondary{border:1px solid #74566a;border-radius:12px;background:#2a2029;color:#f5d7e4;padding:12px 16px}
.panel{background:#201b22;border:1px solid #483444;border-radius:17px;padding:18px;margin:14px 0}
.stack{display:grid;gap:12px}
.status{color:#e9bed1;font-size:13px;line-height:1.6}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.small{padding:7px 10px;font-size:13px}
.muted{color:#c7aeba;font-size:13px;line-height:1.6}
a{color:#f4c2d6}
.manage-row{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:12px;border-bottom:1px solid #3b3039}
.manage-row span{flex:1;overflow-wrap:anywhere}
.hidden{display:none!important}
label{font-size:13px;color:#d7b9c8}
.row{display:grid;grid-template-columns:1fr 2fr;gap:10px}
h2{font-size:21px;margin:8px 0}
h3{font-size:16px;color:#e8b9cd;margin:8px 0}
@media(max-width:480px){
.row{grid-template-columns:1fr}
.manage-row{flex-wrap:wrap}
.manage-row span{flex-basis:100%}
}
</style>
</head>
<body>
<main class="wrap">
<header class="hero">
<div class="eyebrow">MIO TANG ♥︎ ADMIN</div>
<h1>🎀 시그 관리자</h1>
<p><a href="index.html">← 검색 페이지로 돌아가기</a></p>
</header>

<div id="status" class="panel status" role="status">연결 확인 중…</div>

<section id="login" class="panel stack">
<h2>관리자 로그인</h2>
<label>이메일<input id="email" type="email" autocomplete="username"></label>
<label>비밀번호<input id="password" type="password" autocomplete="current-password"></label>
<button class="primary" id="signIn">로그인</button>
</section>

<section id="manage" class="hidden">
<div class="panel stack">
<div class="actions">
<button id="signOut" class="secondary">로그아웃</button>
<button id="refresh" class="secondary">새로고침</button>
</div>
</div>

<div class="panel stack">
<h2>📢 안내 문구 관리</h2>
<p class="muted">검색창 위에 표시되는 안내 문구를 추가하거나 수정할 수 있어요.</p>
<h3 id="noticeTitle">안내 문구 추가</h3>
<label>안내 내용<textarea id="noticeContent" placeholder="안내 문구를 입력해 주세요."></textarea></label>
<label>표시 순서<input id="noticeOrder" type="number" step="1" value="0"></label>
<div class="actions">
<button class="primary" id="noticeSave">안내 저장</button>
<button class="secondary" id="noticeCancel">수정 취소</button>
</div>
<div id="noticeList"></div>
</div>

<div class="panel stack">
<h2>🎀 미오탱 시그 관리</h2>
<p class="muted">검색창 아래에 표시되는 미오탱 시그 번호와 이름을 관리할 수 있어요.</p>
<h3 id="featuredTitle">미오탱 시그 추가</h3>
<div class="row">
<label>시그 번호<input id="featuredNumber" type="number" min="1" step="1" placeholder="예: 1125"></label>
<label>시그 이름<input id="featuredName" type="text" maxlength="150" placeholder="예: 1일1미오"></label>
</div>
<label>표시 순서<input id="featuredOrder" type="number" step="1" value="0"></label>
<div class="actions">
<button class="primary" id="featuredSave">미오탱 시그 저장</button>
<button class="secondary" id="featuredCancel">수정 취소</button>
</div>
<div id="featuredList"></div>
</div>

<div class="panel stack">
<h2 id="editTitle">시그 추가</h2>
<div class="row">
<label>시그 번호<input id="number" type="number" min="1" step="1" placeholder="예: 1250"></label>
<label>시그 이름<input id="name" type="text" maxlength="150" placeholder="예: 미오탱"></label>
</div>
<div class="actions">
<button class="primary" id="save">저장하기</button>
<button class="secondary" id="cancel">수정 취소</button>
</div>
</div>

<div class="panel stack">
<h2>초기 목록 등록</h2>
<p class="muted">온라인 시그 테이블이 비어 있을 때만 사용해 주세요. 기존 시그 123개를 등록하는 기능이며, 이미 등록된 데이터는 덮어쓰지 않아요.</p>
<button class="secondary" id="seed">기존 시그 목록 등록</button>
</div>

<div class="panel stack">
<h2>시그 목록 <span id="total"></span></h2>
<input id="filter" type="search" placeholder="번호 또는 이름 검색">
<div id="list"></div>
</div>
</section>
</main>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const ready=window.MIO_SUPABASE_URL &&
/^https:\/\/.+\.supabase\.co\/?$/.test(window.MIO_SUPABASE_URL) &&
window.supabase;
const client=ready?window.supabase.createClient(
window.MIO_SUPABASE_URL,window.MIO_SUPABASE_KEY

3333|예수님
5000|레전드탱플단
10000|shadow
20000|Fallen Crown
30000|Legends Never Die`;

const initial=initialRaw.trim().split('\n').map(line=>{
const [number,...rest]=line.split('|');
return {number:Number(number),name:rest.join('|')};
});

const $=id=>document.getElementById(id);
let rows=[],editing=null;
let notices=[],noticeEditing=null;
let featured=[],featuredEditing=null;
const status=$('status');
function msg(s){status.textContent=s}

async function check(){
if(!client){
msg('Supabase 연결 설정을 확인해 주세요.');
return;
}
const {data:{user},error}=await client.auth.getUser();
if(error){msg('로그인 확인 실패: '+error.message);return}
const admin=user&&user.id===window.MIO_ADMIN_UID;
$('login').classList.toggle('hidden',!!admin);
$('manage').classList.toggle('hidden',!admin);
if(user&&!admin){
msg('이 계정에는 관리자 권한이 없습니다.');
}else if(admin){
msg('관리자 로그인 완료 ♥︎');
await loadAll();
}else{
msg('관리자 계정으로 로그인해 주세요.');
}
}

$('signIn').onclick=async()=>{
if(!client)return;
msg('로그인 중…');
const {error}=await client.auth.signInWithPassword({
email:$('email').value.trim(),
password:$('password').value
});
$('password').value='';
if(error){msg('로그인 실패: '+error.message);return}
await check();
};

$('signOut').onclick=async()=>{
await client.auth.signOut();
await check();
};

async function loadAll(){
await Promise.all([load(),loadNotices(),loadFeatured()]);
}

$('refresh').onclick=loadAll;

async function load(){
const {data,error}=await client.from('signatures')
.select('id,number,name').order('number');
if(error){msg('시그 목록 읽기 실패: '+error.message);return}
rows=data||[];
draw();
}

function draw(){
const term=$('filter').value.trim().toLowerCase().replace(/\s/g,'');
const matches=rows.filter(x=>
String(x.number).includes(term)||
x.name.toLowerCase().replace(/\s/g,'').includes(term)
);
$('total').textContent=`(${rows.length}개)`;
const list=$('list');
list.replaceChildren();
for(const x of matches){
const row=document.createElement('div');
row.className='manage-row';
const span=document.createElement('span');
span.textContent=`${x.number} · ${x.name}`;
const edit=document.createElement('button');
edit.className='secondary small';
edit.textContent='수정';
edit.onclick=()=>{
editing=x.id;
$('number').value=x.number;
$('name').value=x.name;
$('editTitle').textContent='시그 수정';
$('number').scrollIntoView({behavior:'smooth',block:'center'});
};
const del=document.createElement('button');
del.className='secondary small';
del.textContent='삭제';
del.onclick=async()=>{
if(!confirm(`${x.number} · ${x.name} 시그를 삭제할까요?`))return;
const {error}=await client.from('signatures').delete().eq('id',x.id);
if(error)msg('삭제 실패: '+error.message);
else{msg('삭제 완료 ♥︎');await load()}
};
row.append(span,edit,del);
list.append(row);
}
}

function resetForm(){
editing=null;
$('number').value='';
$('name').value='';
$('editTitle').textContent='시그 추가';
}

$('cancel').onclick=resetForm;
$('filter').oninput=draw;

$('save').onclick=async()=>{
const number=Number($('number').value);
const name=$('name').value.trim();
if(!Number.isSafeInteger(number)||number<=0||!name){
msg('올바른 시그 번호와 이름을 입력해 주세요.');
return;
}
if(rows.some(x=>Number(x.number)===number&&x.id!==editing)){
msg('이미 등록된 시그 번호예요.');
return;
}
let result;
if(editing!==null){
result=await client.from('signatures')
.update({number,name}).eq('id',editing).select();
}else{
result=await client.from('signatures')
.insert({number,name}).select();
}
if(result.error){msg('저장 실패: '+result.error.message);return}
if(!result.data?.length){msg('저장 권한을 확인해 주세요.');return}
resetForm();
msg('저장 완료! 방문자 페이지에도 곧 반영돼요 ♥︎');
await load();
};

$('seed').onclick=async()=>{
if(rows.length){
msg('이미 온라인 시그가 등록되어 있어요. 초기 등록은 빈 테이블에서만 가능해요.');
return;
}
if(!confirm(`기존 시그 ${initial.length}개를 온라인에 등록할까요?`))return;
msg('초기 시그 등록 중…');
let inserted=0;
for(let i=0;i<initial.length;i+=20){
const {error}=await client.from('signatures').insert(initial.slice(i,i+20));
if(error){
msg(`${inserted}개 등록 후 중단됨: ${error.message}`);
await load();
return;
}
inserted+=Math.min(20,initial.length-i);
}
msg(`초기 시그 ${inserted}개 등록 완료 ♥︎`);
await load();
};

async function loadNotices(){
const {data,error}=await client.from('site_notices')
.select('id,content,sort_order').order('sort_order').order('id');
if(error){msg('안내 목록 읽기 실패: '+error.message);return}
notices=data||[];
drawNotices();
}

function drawNotices(){
const list=$('noticeList');
list.replaceChildren();
for(const x of notices){
const row=document.createElement('div');
row.className='manage-row';
const span=document.createElement('span');
span.textContent=x.content;
const edit=document.createElement('button');
edit.className='secondary small';
edit.textContent='수정';
edit.onclick=()=>{
noticeEditing=x.id;
$('noticeContent').value=x.content;
$('noticeOrder').value=x.sort_order;
$('noticeTitle').textContent='안내 문구 수정';
$('noticeContent').scrollIntoView({behavior:'smooth',block:'center'});
};
const del=document.createElement('button');
del.className='secondary small';
del.textContent='삭제';
del.onclick=async()=>{
if(!confirm('이 안내 문구를 삭제할까요?'))return;
const {error}=await client.from('site_notices').delete().eq('id',x.id);
if(error)msg('안내 삭제 실패: '+error.message);
else{msg('안내 삭제 완료 ♥︎');await loadNotices()}
};
row.append(span,edit,del);
list.append(row);
}
}

function resetNotice(){
noticeEditing=null;
$('noticeContent').value='';
$('noticeOrder').value='0';
$('noticeTitle').textContent='안내 문구 추가';
}

$('noticeCancel').onclick=resetNotice;

$('noticeSave').onclick=async()=>{
const content=$('noticeContent').value.trim();
const sort_order=Number($('noticeOrder').value);
if(!content||!Number.isSafeInteger(sort_order)){
msg('안내 내용과 올바른 표시 순서를 입력해 주세요.');
return;
}
const values={content,sort_order};
let result;
if(noticeEditing!==null){
result=await client.from('site_notices')
.update(values).eq('id',noticeEditing).select();
}else{
result=await client.from('site_notices')
.insert(values).select();
}
if(result.error){msg('안내 저장 실패: '+result.error.message);return}
if(!result.data?.length){msg('안내 저장 권한을 확인해 주세요.');return}
resetNotice();
msg('안내 저장 완료 ♥︎');
await loadNotices();
};

async function loadFeatured(){
const {data,error}=await client.from('featured_signatures')
.select('id,number,name,sort_order').order('sort_order').order('number');
if(error){msg('미오탱 시그 읽기 실패: '+error.message);return}
featured=data||[];
drawFeatured();
}

function drawFeatured(){
const list=$('featuredList');
list.replaceChildren();
for(const x of featured){
const row=document.createElement('div');
row.className='manage-row';
const span=document.createElement('span');
span.textContent=`${x.number} · ${x.name}`;
const edit=document.createElement('button');
edit.className='secondary small';
edit.textContent='수정';
edit.onclick=()=>{
featuredEditing=x.id;
$('featuredNumber').value=x.number;
$('featuredName').value=x.name;
$('featuredOrder').value=x.sort_order;
$('featuredTitle').textContent='미오탱 시그 수정';
$('featuredNumber').scrollIntoView({behavior:'smooth',block:'center'});
};
const del=document.createElement('button');
del.className='secondary small';
del.textContent='삭제';
del.onclick=async()=>{
if(!confirm(`${x.number} · ${x.name}을 삭제할까요?`))return;
const {error}=await client.from('featured_signatures')
.delete().eq('id',x.id);
if(error)msg('미오탱 시그 삭제 실패: '+error.message);
else{msg('미오탱 시그 삭제 완료 ♥︎');await loadFeatured()}
};
row.append(span,edit,del);
list.append(row);
}
}

function resetFeatured(){
featuredEditing=null;
$('featuredNumber').value='';
$('featuredName').value='';
$('featuredOrder').value='0';
$('featuredTitle').textContent='미오탱 시그 추가';
}

$('featuredCancel').onclick=resetFeatured;

$('featuredSave').onclick=async()=>{
const number=Number($('featuredNumber').value);
const name=$('featuredName').value.trim();
const sort_order=Number($('featuredOrder').value);
if(!Number.isSafeInteger(number)||number<=0||!name||
!Number.isSafeInteger(sort_order)){
msg('올바른 번호, 이름, 표시 순서를 입력해 주세요.');
return;
}
if(featured.some(x=>Number(x.number)===number&&x.id!==featuredEditing)){
msg('이미 등록된 미오탱 시그 번호예요.');
return;
}
const values={number,name,sort_order};
let result;
if(featuredEditing!==null){
result=await client.from('featured_signatures')
.update(values).eq('id',featuredEditing).select();
}else{
result=await client.from('featured_signatures')
.insert(values).select();
}
if(result.error){msg('미오탱 시그 저장 실패: '+result.error.message);return}
if(!result.data?.length){msg('미오탱 시그 저장 권한을 확인해 주세요.');return}
resetFeatured();
msg('미오탱 시그 저장 완료 ♥︎');
await loadFeatured();
};

check();
</script>
</body>
</html>
