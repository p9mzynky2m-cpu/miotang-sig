<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>미오탱 시그 관리자</title><style>*{box-sizing:border-box}body{margin:0;background:#111014;color:#f9edf3;font-family:system-ui,-apple-system,'Apple SD Gothic Neo',sans-serif}.wrap{max-width:900px;margin:auto;padding:35px 18px 80px}.hero{text-align:center;padding:30px 0 25px}.eyebrow{color:#e8b9cd;letter-spacing:4px;font-size:12px}.hero h1{font-size:clamp(30px,7vw,49px);margin:12px 0}.hero p{color:#c9b9c3;font-size:14px}.search{position:sticky;top:0;background:#111014ee;backdrop-filter:blur(14px);padding:16px 0;z-index:2}.search input,input{width:100%;padding:16px 18px;background:#272129;color:#fff;border:1px solid #6d4c60;border-radius:14px;font-size:16px;outline:none}.search input:focus,input:focus{border-color:#f5b9d3}.search input::placeholder{color:#a999a4}.info{display:flex;justify-content:space-between;align-items:center;margin:15px 3px;color:#cdb8c4;font-size:13px}.info button{background:transparent;color:#eec2d5;border:0;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}.item{display:flex;align-items:center;gap:15px;background:#201b22;border:1px solid #382c37;border-radius:13px;padding:14px;text-align:left;color:#fcebf3;cursor:pointer;min-width:0}.item:hover{border-color:#d9a5be;background:#302530}.num{font-size:20px;font-weight:800;color:#f4c2d6;min-width:58px}.name{font-size:16px;font-weight:600;overflow-wrap:anywhere}.empty{text-align:center;color:#c9aeba;padding:50px 10px}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#f7d8e6;color:#241820;padding:12px 20px;border-radius:30px;display:none;box-shadow:0 8px 30px #0007;z-index:5}.foot{text-align:center;color:#8e7a87;margin-top:30px;font-size:12px}button{cursor:pointer}.primary{border:0;border-radius:12px;background:#efb9d0;color:#21151d;font-weight:700;padding:13px 18px}.secondary{border:1px solid #74566a;border-radius:12px;background:#2a2029;color:#f5d7e4;padding:12px 16px}.panel{background:#201b22;border:1px solid #483444;border-radius:17px;padding:18px;margin:14px 0}.stack{display:grid;gap:12px}.status{color:#e9bed1;font-size:13px;line-height:1.6}.actions{display:flex;gap:8px;flex-wrap:wrap}.small{padding:7px 10px;font-size:13px}.muted{color:#c7aeba;font-size:13px}a{color:#f4c2d6}@media(max-width:480px){.grid{grid-template-columns:1fr 1fr;gap:8px}.item{padding:12px 10px;gap:8px}.num{font-size:17px;min-width:44px}.name{font-size:13px}} .manage-row{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:12px;border-bottom:1px solid #3b3039}.manage-row span{flex:1}.hidden{display:none!important}label{font-size:13px;color:#d7b9c8}.row{display:grid;grid-template-columns:1fr 2fr;gap:10px}@media(max-width:480px){.row{grid-template-columns:1fr}}</style></head><body><main class="wrap"><header class="hero"><div class="eyebrow">MIO TANG ♡ ADMIN</div><h1>🎀 시그 관리자</h1><p><a href="index.html">← 검색 페이지로 돌아가기</a></p></header><div id="status" class="panel status" role="status">연결 확인 중…</div><section id="login" class="panel stack"><h2>관리자 로그인</h2><label>이메일<input id="email" type="email" autocomplete="username"></label><label>비밀번호<input id="password" type="password" autocomplete="current-password"></label><button class="primary" id="signIn">로그인</button></section><section id="manage" class="hidden"><div class="panel stack"><div class="actions"><button id="signOut" class="secondary">로그아웃</button><button id="refresh" class="secondary">새로고침</button></div><h2 id="editTitle">시그 추가</h2><div class="row"><label>시그 번호<input id="number" type="number" min="1" step="1" placeholder="예: 303"></label><label>시그 이름<input id="name" type="text" maxlength="150" placeholder="예: 아이스크림"></label></div><div class="actions"><button class="primary" id="save">저장하기</button><button class="secondary" id="cancel">수정 취소</button></div></div><div class="panel stack"><h2>초기 목록 등록</h2><p class="muted">온라인 테이블이 비어 있을 때만 사용해 주세요. 기존 사이트의 시그 123개를 Supabase에 등록합니다. 기존 데이터는 덮어쓰지 않아요.</p><button class="secondary" id="seed">기존 시그 목록 등록</button></div><div class="panel stack"><h2>시그 목록 <span id="total"></span></h2><input id="filter" type="search" placeholder="번호 또는 이름 검색"><div id="list"></div></div></section></main><script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>

er": 1045, "name": "참치마요"}, {"number": 1050, "name": "채채"}, {"number": 1054, "name": "방송볼거없Na"}, {"number": 1055, "name": "상사화"}, {"number": 1056, "name": "스카이라인"}, {"number": 1059, "name": "봉구"}, {"number": 1060, "name": "뽕탱"}, {"number": 1069, "name": "골프69"}, {"number": 1070, "name": "라네트"}, {"number": 1071, "name": "왕자지원"}, {"number": 1072, "name": "내꺼하자"}, {"number": 1077, "name": "끄악"}, {"number": 1079, "name": "터미널"}, {"number": 1080, "name": "엘제에이"}, {"number": 1082, "name": "히리언니"}, {"number": 1090, "name": "알라뷰탱플단"}, {"number": 1092, "name": "개리"}, {"number": 1094, "name": "압구정아쿠자"}, {"number": 1098, "name": "last day"}, {"number": 1099, "name": "구구"}, {"number": 1111, "name": "지기직직"}, {"number": 1112, "name": "이새기가범인"}, {"number": 1119, "name": "이멀전시"}, {"number": 1110, "name": "예수형2"}, {"number": 1132, "name": "무아이경"}, {"number": 1159, "name": "로얄오크"}, {"number": 1172, "name": "정철이"}, {"number": 1174, "name": "벨라74"}, {"number": 1190, "name": "뷰티풀"}, {"number": 1200, "name": "취팔형2"}, {"number": 1210, "name": "only tang"}, {"number": 1222, "name": "마티니"}, {"number": 1233, "name": "왈스미"}, {"number": 1234, "name": "신입"}, {"number": 1248, "name": "love me"}, {"number": 1250, "name": "미오탱"}, {"number": 1252, "name": "북동2"}, {"number": 1254, "name": "탱베이비"}, {"number": 1256, "name": "수라"}, {"number": 1258, "name": "허군"}, {"number": 1259, "name": "북동"}, {"number": 1333, "name": "니엘형"}, {"number": 1500, "name": "짭예비형"}, {"number": 1515, "name": "짭승환형"}, {"number": 1525, "name": "출항"}, {"number": 1878, "name": "덴빌형2"}, {"number": 1888, "name": "작은예멘"}, {"number": 1997, "name": "프지니"}, {"number": 2010, "name": "by.T"}, {"number": 2011, "name": "다크초코핑"}, {"number": 2040, "name": "주남2"}, {"number": 2044, "name": "큰라네트"}, {"number": 2077, "name": "큰끄악"}, {"number": 2080, "name": "빅허군"}, {"number": 2500, "name": "디스이즈탱"}, {"number": 2948, "name": "v12_romance"}, {"number": 2997, "name": "1프로"}, {"number": 2999, "name": "큰예멘"}, {"number": 3052, "name": "십만로디"}, {"number": 3333, "name": "예수님"}, {"number": 5000, "name": "레전드탱플단"}, {"number": 10000, "name": "shadow"}, {"number": 20000, "name": "Fallen Crown"}, {"number": 30000, "name": "Legends Never Die"}];
const $=id=>document.getElementById(id);let rows=[],editing=null;const status=$('status');function msg(s){status.textContent=s};
async function check(){if(!client){msg('Supabase API URL이 설정되지 않았어요. config.js의 YOUR_SUPABASE_URL을 수정해 주세요.');return}const {data:{user}}=await client.auth.getUser();const admin=user&&user.id===window.MIO_ADMIN_UID;$('login').classList.toggle('hidden',!!admin);$('manage').classList.toggle('hidden',!admin);if(user&&!admin)msg('이 계정에는 관리자 권한이 없습니다.');else if(admin){msg('관리자 로그인 완료 ♡');await load()}else msg('관리자 계정으로 로그인해 주세요.')}
$('signIn').onclick=async()=>{if(!client)return;msg('로그인 중…');const {error}=await client.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});$('password').value='';if(error){msg('로그인 실패: '+error.message);return}await check()};
$('signOut').onclick=async()=>{await client.auth.signOut();await check()};
async function load(){const {data,error}=await client.from('signatures').select('id,number,name').order('number');if(error){msg('목록 읽기 실패: '+error.message);return}rows=data||[];draw()}
function draw(){const term=$('filter').value.trim().toLowerCase().replace(/\s/g,'');const matches=rows.filter(x=>String(x.number).includes(term)||x.name.toLowerCase().replace(/\s/g,'').includes(term));$('total').textContent=`(${rows.length}개)`;const list=$('list');list.replaceChildren();for(const x of matches){const row=document.createElement('div');row.className='manage-row';const span=document.createElement('span');span.textContent=`${x.number} · ${x.name}`;const edit=document.createElement('button');edit.className='secondary small';edit.textContent='수정';edit.onclick=()=>{editing=x.id;$('number').value=x.number;$('name').value=x.name;$('editTitle').textContent='시그 수정';window.scrollTo({top:0,behavior:'smooth'})};const del=document.createElement('button');del.className='secondary small';del.textContent='삭제';del.onclick=async()=>{if(!confirm(`${x.number} · ${x.name} 시그를 삭제할까요?`))return;const {error}=await client.from('signatures').delete().eq('id',x.id);if(error)msg('삭제 실패: '+error.message);else{msg('삭제 완료 ♡');await load()}};row.append(span,edit,del);list.append(row)}}
function resetForm(){editing=null;$('number').value='';$('name').value='';$('editTitle').textContent='시그 추가'}
$('cancel').onclick=resetForm;$('filter').oninput=draw;$('refresh').onclick=load;
$('save').onclick=async()=>{const number=Number($('number').value),name=$('name').value.trim();if(!Number.isSafeInteger(number)||number<=0||!name){msg('올바른 시그 번호와 이름을 입력해 주세요.');return}if(rows.some(x=>Number(x.number)===number&&x.id!==editing)){msg('이미 등록된 시그 번호예요.');return}let result;if(editing!==null)result=await client.from('signatures').update({number,name}).eq('id',editing).select();else result=await client.from('signatures').insert({number,name}).select();if(result.error){msg('저장 실패: '+result.error.message);return}if(!result.data?.length){msg('저장 권한을 확인해 주세요. 변경이 반영되지 않았어요.');return}resetForm();msg('저장 완료! 방문자 페이지에도 곧 반영돼요 ♡');await load()};
$('seed').onclick=async()=>{if(rows.length){msg('이미 온라인 시그가 등록되어 있어요. 초기 등록은 빈 테이블에서만 가능해요.');return}if(!confirm(`기존 시그 ${initial.length}개를 온라인에 등록할까요?`))return;msg('초기 시그 등록 중…');let inserted=0;for(let i=0;i<initial.length;i+=20){const {error}=await client.from('signatures').insert(initial.slice(i,i+20));if(error){msg(`${inserted}개 등록 후 중단됨: ${error.message}`);await load();return}inserted+=Math.min(20,initial.length-i)}msg(`초기 시그 ${inserted}개 등록 완료 ♡`);await load()};
check();
