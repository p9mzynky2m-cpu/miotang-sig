<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>미오탱 시그 검색</title><style>*{box-sizing:border-box}body{margin:0;background:#111014;color:#f9edf3;font-family:system-ui,-apple-system,'Apple SD Gothic Neo',sans-serif}.wrap{max-width:900px;margin:auto;padding:35px 18px 80px}.hero{text-align:center;padding:30px 0 25px}.eyebrow{color:#e8b9cd;letter-spacing:4px;font-size:12px}.hero h1{font-size:clamp(30px,7vw,49px);margin:12px 0}.hero p{color:#c9b9c3;font-size:14px}.search{position:sticky;top:0;background:#111014ee;backdrop-filter:blur(14px);padding:16px 0;z-index:2}.search input,input{width:100%;padding:16px 18px;background:#272129;color:#fff;border:1px solid #6d4c60;border-radius:14px;font-size:16px;outline:none}.search input:focus,input:focus{border-color:#f5b9d3}.search input::placeholder{color:#a999a4}.info{display:flex;justify-content:space-between;align-items:center;margin:15px 3px;color:#cdb8c4;font-size:13px}.info button{background:transparent;color:#eec2d5;border:0;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}.item{display:flex;align-items:center;gap:15px;background:#201b22;border:1px solid #382c37;border-radius:13px;padding:14px;text-align:left;color:#fcebf3;cursor:pointer;min-width:0}.item:hover{border-color:#d9a5be;background:#302530}.num{font-size:20px;font-weight:800;color:#f4c2d6;min-width:58px}.name{font-size:16px;font-weight:600;overflow-wrap:anywhere}.empty{text-align:center;color:#c9aeba;padding:50px 10px}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#f7d8e6;color:#241820;padding:12px 20px;border-radius:30px;display:none;box-shadow:0 8px 30px #0007;z-index:5}.foot{text-align:center;color:#8e7a87;margin-top:30px;font-size:12px}button{cursor:pointer}.primary{border:0;border-radius:12px;background:#efb9d0;color:#21151d;font-weight:700;padding:13px 18px}.secondary{border:1px solid #74566a;border-radius:12px;background:#2a2029;color:#f5d7e4;padding:12px 16px}.panel{background:#201b22;border:1px solid #483444;border-radius:17px;padding:18px;margin:14px 0}.stack{display:grid;gap:12px}.status{color:#e9bed1;font-size:13px;line-height:1.6}.actions{display:flex;gap:8px;flex-wrap:wrap}.small{padding:7px 10px;font-size:13px}.muted{color:#c7aeba;font-size:13px}a{color:#f4c2d6}@media(max-width:480px){.grid{grid-template-columns:1fr 1fr;gap:8px}.item{padding:12px 10px;gap:8px}.num{font-size:17px;min-width:44px}.name{font-size:13px}}</style></head><body><main class="wrap"><header class="hero"><div class="eyebrow">MIO TANG ♡ SIGNATURE</div><h1>🎀 미오탱 시그 검색</h1><p>시그 번호 또는 이름을 검색해 보세요!</p></header><section class="search"><input id="q" type="search" placeholder="🔎 예: 303 또는 아이스크림" autocomplete="off" aria-label="시그 번호 또는 이름 검색"><div class="info"><span id="count"></span><button id="reset">전체 보기 ↺</button></div><div id="status" class="status" role="status"></div></section><section class="grid" id="results"></section><div class="empty" id="empty" hidden>검색 결과가 없어요. 다른 번호나 이름을 입력해 주세요 ♡</div><p class="foot">검색 결과를 누르면 시그 번호가 복사돼요 ♡</p><p class="foot"><a href="admin.html">관리자 로그인</a></p></main><div class="toast" id="toast" role="status"></div><script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>
const raw="100|탱하\n120|워크\n122|첫 눈\n123|내 얘길 들어봐\n125|아웅다웅\n130|힙사돈\n134|if you love me\n139|쌔끈빠끈\n140|레제\n150|바빠\n152|외모첵\n155|서핀 보이\n167|여름이었다\n171|BDZ\n182|WTF\n188|피리송\n197|런웨이\n200|오버드라이브\n202|Lebel heart\n220|bass down low\n222|GG EZ\n223|링링\n225|홀리몰리\n232|미야오\n234|왠지\n237|고민중독\n250|꿍시꿍시\n252|라라리라라\n255|냥냥 펀치\n300|핑크레이디\n302|pink hoodie\n303|아이스크림\n304|100개\n313|Door\n325|두번째지구\n333|연애의 조건\n337|캐치캐치\n340|뱅뱅\n345|LSD\n500|계엄령\n526|트월킹덕\n544|NaNaNa\n573|Only Sera\n588|오빠하앙\n666|BAD\n782|호텔파티\n1000|heart\n1003|주남만세\n1008|똥먹빵\n1010|탱탱\n1011|초코핑\n1015|햄싫어\n1018|문신\n1020|러너\n1022|2_step\n1025|진주야\n1026|씹고\n1030|엔더\n1042|fox\n1045|참치마요\n1050|채채\n1054|방송볼거없Na\n1055|상사화\n1056|스카이라인\n1059|봉구\n1060|뽕탱\n1069|골프69\n1070|라네트\n1071|왕자지원\n1072|내꺼하자\n1077|끄악\n1079|터미널\n1080|엘제에이\n1082|히리언니\n1090|알라뷰탱플단\n1092|개리\n1094|압구정아쿠자\n1098|last day\n1099|구구\n1111|지기직직\n1112|이새기가범인\n1119|이멀전시\n1110|예수형2\n1132|무아이경\n1159|로얄오크\n1172|정철이\n1174|벨라74\n1190|뷰티풀\n1200|취팔형2\n1210|only tang\n1222|마티니\n1233|왈스미\n1234|신입\n1248|love me\n1250|미오탱\n1252|북동2\n1254|탱베이비\n1256|수라\n1258|허군\n1259|북동\n1333|니엘형\n1500|짭예비형\n1515|짭승환형\n1525|출항\n1878|덴빌형2\n1888|작은예멘\n1997|프지니\n2010|by.T\n2011|다크초코핑\n2040|주남2\n2044|큰라네트\n2077|큰끄악\n2080|빅허군\n2500|디스이즈탱\n2948|v12_romance\n2997|1프로\n2999|큰예멘\n3052|십만로디\n3333|예수님\n5000|레전드탱플단\n10000|shadow\n20000|Fallen Crown\n30000|Legends Never Die";
let data=raw.trim().split('\n').map(line=>{const [number,...rest]=line.split('|');return {number:Number(number),name:rest.join('|')}}).sort((a,b)=>a.number-b.number);
const q=document.querySelector('#q'),results=document.querySelector('#results'),count=document.querySelector('#count'),empty=document.querySelector('#empty'),toast=document.querySelector('#toast'),status=document.querySelector('#status');let timer;
function render(){const term=q.value.trim().toLocaleLowerCase().replace(/\s/g,'');const filtered=data.filter(x=>String(x.number).includes(term)||x.name.toLocaleLowerCase().replace(/\s/g,'').includes(term));count.textContent=term?`검색 결과 ${filtered.length}개`:`전체 ${data.length}개 시그`;results.replaceChildren();empty.hidden=filtered.length!==0;for(const x of filtered){const b=document.createElement('button');b.className='item';b.type='button';const n=document.createElement('span');n.className='num';n.textContent=x.number;const t=document.createElement('span');t.className='name';t.textContent=x.name;b.append(n,t);b.onclick=async()=>{try{await navigator.clipboard.writeText(String(x.number));toast.textContent=`${x.number} 복사 완료 ♡`}catch{toast.textContent=`번호: ${x.number}`}toast.style.display='block';clearTimeout(timer);timer=setTimeout(()=>toast.style.display='none',1900)};results.append(b)}}
q.addEventListener('input',render);document.querySelector('#reset').onclick=()=>{q.value='';render();q.focus()};
const ready=window.MIO_SUPABASE_URL && /^https:\/\/.+\.supabase\.co\/?$/.test(window.MIO_SUPABASE_URL) && window.supabase;
const client=ready?window.supabase.createClient(window.MIO_SUPABASE_URL,window.MIO_SUPABASE_KEY):null;

async function refresh(){if(!client){status.textContent='기존 목록 표시 중 · Supabase 연결 설정이 아직 완료되지 않았어요.';return}try{const {data:rows,error}=await client.from('signatures').select('number,name').order('number');if(error)throw error;if(rows.length){data=rows.map(x=>({number:Number(x.number),name:x.name}));status.textContent='온라인 시그 목록 · 자동 업데이트'}else{status.textContent='온라인 목록이 비어 있어 기존 시그를 임시 표시 중이에요. 관리자 페이지에서 초기 목록을 등록해 주세요.'}render()}catch(e){status.textContent='온라인 목록을 불러오지 못해 기존 목록을 표시 중이에요.';console.error(e)}}
render();refresh();setInterval(refresh,15000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()});
</script></body></html>
