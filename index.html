<style>

const baseData=raw.trim().split('\n').map(line=>{
 const [number,...rest]=line.split('|');
 return {number:Number(number),name:rest.join('|')};
}).sort((a,b)=>a.number-b.number);

let data=baseData.slice();

const q=document.querySelector('#q');
const results=document.querySelector('#results');
const count=document.querySelector('#count');
const empty=document.querySelector('#empty');
const toast=document.querySelector('#toast');
const status=document.querySelector('#status');
const recentPop=document.querySelector('#recentPop');
const recentRows=document.querySelector('#recentRows');

const PREFIX='miotang_sig_v3_';

function read(key,fallback){
 try{
  const value=localStorage.getItem(PREFIX+key);
  return value===null?fallback:JSON.parse(value);
 }catch{return fallback}
}

function write(key,value){
 try{
  localStorage.setItem(PREFIX+key,JSON.stringify(value));
 }catch(e){console.warn(e)}
}

let favorites=read('favorites',null);
if(!Array.isArray(favorites)){
 try{
  favorites=JSON.parse(localStorage.getItem('miotang_sig_v2_favorites')||'[]');
 }catch{favorites=[]}
}
if(!Array.isArray(favorites))favorites=[];
favorites=favorites.map(Number).filter(Number.isFinite);

let history=read('history',null);
if(!Array.isArray(history)){
 try{
  history=JSON.parse(localStorage.getItem('miotang_sig_v2_history')||'[]');
 }catch{history=[]}
}
if(!Array.isArray(history))history=[];
history=history.map(Number).filter(Number.isFinite).slice(0,7);

let known=read('known',null);
let newItems=read('new',{});
if(!newItems||typeof newItems!=='object'||Array.isArray(newItems)){
 newItems={};
}

let currentFilter='all';
let timer;

const digitClass=n=>
 String(n).length>=5?'digits-5':
 String(n).length===4?'digits-4':'digits-3';

function isNew(n){
 const t=newItems[String(n)];
 return Number.isFinite(t)&&Date.now()-t<604800000;
}

function trackNew(rows){
 const nums=rows.map(x=>String(x.number));

 if(!Array.isArray(known)){
  known=nums;
 }else{
  const before=new Set(known);
  for(const n of nums){
   if(!before.has(n)&&!newItems[n]){
    newItems[n]=Date.now();
   }
  }
  known=nums;
 }

 for(const n of Object.keys(newItems)){
  if(!isNew(n))delete newItems[n];
 }

 write('known',known);
 write('new',newItems);
}

function notify(message){
 toast.textContent=message;
 toast.style.display='block';
 clearTimeout(timer);
 timer=setTimeout(()=>toast.style.display='none',1900);
}

function saveHistory(number){
 history=[number,...history.filter(n=>n!==number)].slice(0,7);
 write('history',history);
 renderRecent();
}

async function copyNumber(number){
 saveHistory(number);
 closeRecent();

 try{
  await navigator.clipboard.writeText(String(number));
  notify(`${number} 복사 완료 ♥︎`);
 }catch{
  notify(`번호: ${number}`);
 }
}

function toggleFavorite(number){
 if(favorites.includes(number)){
  favorites=favorites.filter(n=>n!==number);
  notify('즐겨찾기에서 삭제했어요 ♡');
 }else{
  favorites.unshift(number);
  notify('즐겨찾기에 추가했어요 ♥︎');
 }

 write('favorites',favorites);
 render();
}

function renderRecent(){
 recentRows.replaceChildren();

 const items=history
  .map(n=>data.find(x=>x.number===n))
  .filter(Boolean)
  .slice(0,7);

 if(!items.length){
  const p=document.createElement('div');
  p.className='recent-empty';
  p.textContent='아직 최근 기록이 없어요.';
  recentRows.append(p);
  return;
 }

 for(const x of items){
  const b=document.createElement('button');
  b.type='button';
  b.className='recent-row';

  const n=document.createElement('span');
  n.className='recent-number '+digitClass(x.number);
  n.textContent=x.number;

  const t=document.createElement('span');
  t.textContent=x.name;

  b.append(n,t);
  b.onclick=()=>copyNumber(x.number);
  recentRows.append(b);
 }
}

function openRecent(){
 if(q.value.trim()===''){
  renderRecent();
  recentPop.hidden=false;
 }
}

function closeRecent(){
 recentPop.hidden=true;
}

function render(){
 const term=q.value.trim().toLocaleLowerCase().replace(/\s/g,'');

 let filtered=data.filter(x=>
  String(x.number).includes(term)||
  x.name.toLocaleLowerCase().replace(/\s/g,'').includes(term)
 );

 if(currentFilter==='fav'){
  filtered=filtered.filter(x=>favorites.includes(x.number));
 }

 if(currentFilter==='new'){
  filtered=filtered.filter(x=>isNew(x.number));
 }

 count.textContent=term
  ?`검색 결과 ${filtered.length}개`
  :`${currentFilter==='all'?'전체':'선택한'} ${filtered.length}개 시그`;

 results.replaceChildren();
 empty.hidden=filtered.length!==0;

 for(const x of filtered){
  const item=document.createElement('div');
  item.className='item '+digitClass(x.number);

  if(String(x.number).length>=5){
   item.classList.add('long-number');
  }

  const main=document.createElement('button');
  main.type='button';
  main.className='item-main';
  main.setAttribute('aria-label',`${x.number} ${x.name} 번호 복사`);

  const n=document.createElement('span');
  n.className='num';
  n.textContent=x.number;

  const wrap=document.createElement('span');
  wrap.className='name-wrap';

  const name=document.createElement('span');
  name.className='name';
  name.textContent=x.name;
  wrap.append(name);

  if(isNew(x.number)){
   const badge=document.createElement('span');
   badge.className='new-badge';
   badge.textContent='NEW';
   wrap.append(badge);
  }

  main.append(n,wrap);
  main.onclick=()=>copyNumber(x.number);

  const fav=document.createElement('button');
  fav.type='button';
  fav.className='fav-btn';

  const saved=favorites.includes(x.number);
  fav.textContent=saved?'♥':'♡';

  if(saved)fav.classList.add('saved');

  fav.setAttribute('aria-label',saved?'즐겨찾기 삭제':'즐겨찾기 추가');
  fav.setAttribute('aria-pressed',String(saved));
  fav.onclick=()=>toggleFavorite(x.number);

  item.append(main,fav);
  results.append(item);
 }
}

q.addEventListener('focus',openRecent);
q.addEventListener('click',openRecent);

q.addEventListener('input',()=>{
 if(q.value.trim())closeRecent();
 else openRecent();
 render();
});

document.addEventListener('pointerdown',e=>{
 if(!document.querySelector('#searchArea').contains(e.target)){
  closeRecent();
 }
});

document.querySelector('#clearHistory').onclick=()=>{
 history=[];
 write('history',history);
 renderRecent();
 notify('최근 기록을 삭제했어요 ♥︎');
};

document.querySelector('#reset').onclick=()=>{
 q.value='';
 currentFilter='all';
 setFilterButtons();
 render();
 q.focus();
 openRecent();
};

function setFilterButtons(){
 document.querySelectorAll('.filter-btn').forEach(b=>
  b.classList.toggle('active',b.dataset.filter===currentFilter)
 );
}

document.querySelectorAll('.filter-btn').forEach(b=>{
 b.onclick=()=>{
  currentFilter=b.dataset.filter;
  setFilterButtons();
  closeRecent();
  render();
 };
});

const ready=
 window.MIO_SUPABASE_URL&&
 /^https:\/\/.+\.supabase\.co\/?$/.test(window.MIO_SUPABASE_URL)&&
 window.MIO_SUPABASE_KEY&&
 window.supabase;

const client=ready
 ?window.supabase.createClient(
  window.MIO_SUPABASE_URL,
  window.MIO_SUPABASE_KEY
 )
 :null;

function normalizeRows(rows){
 const byNumber=new Map();

 for(const x of rows){
  const number=Number(x.number);
  if(Number.isFinite(number)&&x.name!=null){
   byNumber.set(number,{number,name:String(x.name)});
  }
 }

 return [...byNumber.values()].sort((a,b)=>a.number-b.number);
}

async function refresh(){
 if(!client){
  status.textContent='기존 목록 표시 중 · Supabase 연결 설정을 확인해 주세요.';
  data=normalizeRows(baseData);
  trackNew(data);
  render();
  renderRecent();
  return;
 }

 try{
  const {data:rows,error}=await client
   .from('signatures')
   .select('number,name')
   .order('number');

  if(error)throw error;

  if(rows.length){
   data=normalizeRows(rows);
   status.textContent='온라인 시그 목록 · 자동 업데이트';
  }else{
   data=normalizeRows(baseData);
   status.textContent='온라인 목록이 비어 있어 기존 시그를 임시 표시 중이에요.';
  }

  trackNew(data);
  render();
  renderRecent();

 }catch(e){
  status.textContent='온라인 목록을 불러오지 못해 기존 목록을 표시 중이에요.';
  console.error(e);
  data=normalizeRows(baseData);
  trackNew(data);
  render();
  renderRecent();
 }
}

async function refreshExtras(){
 if(!client)return;

 try{
  const [noticesResult,featuredResult]=await Promise.all([
   client.from('site_notices')
    .select('content')
    .order('sort_order')
    .order('id'),

   client.from('featured_signatures')
    .select('number,name')
    .order('sort_order')
    .order('number')
  ]);

  if(!noticesResult.error){
   const box=document.getElementById('notices');
   box.replaceChildren();

   for(const x of noticesResult.data||[]){
    const p=document.createElement('p');
    p.textContent=x.content;
    box.append(p);
   }
  }

  if(!featuredResult.error){
   const box=document.getElementById('featured');
   box.replaceChildren();

   for(const x of featuredResult.data||[]){
    const row=document.createElement('div');
    row.className='featured-row';

    const number=document.createElement('span');
    number.className='featured-number';
    number.textContent=x.number;

    const name=document.createElement('span');
    name.className='featured-name';
    name.textContent=x.name;

    row.append(number,name);
    box.append(row);
   }
  }
 }catch(e){
  console.error(e);
 }
}

async function refreshAll(){
 await Promise.all([refresh(),refreshExtras()]);
}

data=normalizeRows(baseData);
render();
renderRecent();
refreshAll();

setInterval(refreshAll,15000);

document.addEventListener('visibilitychange',()=>{
 if(!document.hidden)refreshAll();
});
</script>
